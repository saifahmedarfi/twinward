# OpenTelemetry Collector — observability plane (proposal Figure 1).
# Receives OTLP traces (one trace per experiment) and logs (the normalized,
# trace-correlated event stream) from the runner and the five estate services,
# batches them, and persists them as JSON lines (run-scoped evidence).
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  batch: { timeout: 2s, send_batch_size: 1024 }
  resource:
    attributes:
      - { key: props.environment, value: isolated-simulation, action: upsert }

exporters:
  file/traces: { path: /var/otel/traces.jsonl }
  file/logs:   { path: /var/otel/logs.jsonl }
  debug:       { verbosity: basic }

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888        # collector self-metrics, scraped by Prometheus
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file/traces, debug]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file/logs, debug]
